<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
      <script src="https://cdn.tailwindcss.com"></script>
   

</head>
<body class="bg-gray-100 h-screen ">
       <div class= "flex flex-col justify-center items-center min-h-screen">
        
        <h1 class=" text-2xl font-bold text-blue-700">
            Score Counter 
        </h1>
        <div class=" mt-2 flex flex-row border-2 border-gray-200 bg-slate-300 rounded-lg p-2">

        <p class="text-black  text-2xl font-bold">
            Total score:
            </p>
            <p id="score" class= "text-red-700 ml-2 text-2xl font-bold">
                0
            </p>
            </div>
            <div class=" flex flex-row  gap-4 mt-4 ">
                <button onclick="increase(1)"
                class ="border border-blue-700 bg-blue-700 rounded-lg px-2 py-1 text-white text-xl font-bold">
                   +1
                </button>
                 <button onclick="increase(2)"
                class ="border border-blue-700 bg-blue-700 rounded-lg px-2 py-1 text-white text-xl font-bold">
                   +2
                </button>

                 <button onclick="increase(4)"
                class ="border border-blue-700 bg-blue-700 rounded-lg px-2 py-1 text-white text-xl font-bold">
                   +4
                </button>
                
                 <button onclick="increase(6)"
                class ="border border-blue-700 bg-blue-700 rounded-lg px-2 py-1 text-white text-xl font-bold">
                   +6
                </button>

            </div>

            </div>
            <script src="index.js"> </script>
           
</body>
</html>
